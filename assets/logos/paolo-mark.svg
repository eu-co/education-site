<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="paolo.org.uk">
  <defs>
    <linearGradient id="pm-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <linearGradient id="pm-g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <linearGradient id="pm-g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#00FF80" />
    </linearGradient>
    <linearGradient id="pm-g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF80" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>
    <linearGradient id="pm-g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#8000FF" />
    </linearGradient>
    <linearGradient id="pm-g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8000FF" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <path id="pm-swirl" d="M 0,0 C 70,-20 100,-80 0,-100 C -30,-50 -20,-20 0,0 Z" />
  </defs>

  <style>
    /* Disc follows the viewer's theme. Class and ids are prefixed "pm-" so
       this inline SVG can't collide with anything else on the page. */
    .pm-bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .pm-bg { fill: #111111; }
    }
  </style>

  <circle cx="100" cy="100" r="100" class="pm-bg" />

  <g transform="translate(100, 100)">
    <use href="#pm-swirl" fill="url(#pm-g1)" opacity="0.8" />
    <use href="#pm-swirl" fill="url(#pm-g2)" opacity="0.8" transform="rotate(60)" />
    <use href="#pm-swirl" fill="url(#pm-g3)" opacity="0.8" transform="rotate(120)" />
    <use href="#pm-swirl" fill="url(#pm-g4)" opacity="0.8" transform="rotate(180)" />
    <use href="#pm-swirl" fill="url(#pm-g5)" opacity="0.8" transform="rotate(240)" />
    <use href="#pm-swirl" fill="url(#pm-g6)" opacity="0.8" transform="rotate(300)" />
  </g>

  <circle cx="100" cy="100" r="16" class="pm-bg" />
</svg>
